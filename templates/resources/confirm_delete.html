{% extends "base.html" %}
{% block title %}Delete resource{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="mc-card">
      <h1 class="h4 fw-bold">Remove "{{ resource.name }}"?</h1>
      <p>It will no longer appear in the directory, on result pages or on the crisis screen.</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, remove it</button>
        <a href="{{ resource.get_absolute_url }}" class="btn btn-link">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
